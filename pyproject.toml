[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-data-cleaner"
version = "1.0.0"
description = "Clean, validate, and standardize CSV data: encoding/delimiter detection, missing-value strategies, type coercion, and validated email/phone columns."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matt" }]
requires-python = ">=3.12"  # numpy>=2.5.1 requires Python>=3.12
dependencies = [
    "pandas>=3.0.5,<4.0.0",
    "numpy>=2.5.1,<3.0.0",
    "chardet>=7.5.1,<8.0.0",
    "click>=8.4.2,<9.0.0",
    "tabulate>=0.10.0,<0.11.0",
    "email-phone-validator @ git+https://github.com/Matthew-Cassin/email-phone-validator.git@v1.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["csv", "data-cleaning", "data-quality", "validation", "pandas"]

[project.urls]
Homepage = "https://github.com/Matthew-Cassin/csv-data-cleaner"
Repository = "https://github.com/Matthew-Cassin/csv-data-cleaner"
Issues = "https://github.com/Matthew-Cassin/csv-data-cleaner/issues"

[project.scripts]
csv-data-cleaner = "csv_data_cleaner.cli:clean"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas-stubs",
    "types-tabulate",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csv_data_cleaner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["csv_data_cleaner"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# python_version intentionally unset: mypy then targets whatever interpreter
# runs it, which matches each CI matrix leg. A hardcoded low pin here breaks
# on newer numpy/pandas stubs that use 3.12+-only stub syntax.
[tool.mypy]
strict = true

